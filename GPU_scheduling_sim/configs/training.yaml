# PPO Training Configuration
seed: 42
device: "cuda"  # fallback to "cpu" automatically if cuda is unavailable

# Environment settings
cluster_config: "configs/cluster_small.yaml"
reward_config: "configs/reward.yaml"
scenario: "mixed"  # Trains across all 6 scenarios simultaneously
max_queue_size: 16
sim_horizon_seconds: 3600.0  # 1 hour simulation per episode

# PPO Hyperparameters
learning_rate: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_ratio: 0.2
entropy_coef: 0.01
value_coef: 0.5
max_grad_norm: 0.5

# Rollout & Optimization
num_envs: 8            # Parallel environment workers
rollout_length: 256    # Steps per env per rollout (total batch = num_envs * rollout_length = 2048)
minibatch_size: 128
epochs_per_update: 10
total_timesteps: 200000

# Network Architecture
hidden_dim: 256
num_layers: 2

# Logging & Checkpoints
eval_freq_steps: 10000
eval_episodes: 5
checkpoint_dir: "checkpoints"
save_freq_steps: 25000
