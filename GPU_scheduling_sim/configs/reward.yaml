# Clean Priority-Weighted Flow-Time & SLA Scheduling Objective:
reward_scale: 0.05                # Global scale keeping per-step reward O(1) and episode returns in [-10, -50]
flow_time_weight: 1.00            # Continuous cost: sum(priority_j / 5.0 * dt) across all unfinished queue & running jobs
deadline_miss_weight: 5.00        # Strict penalty for missing deadline (priority scaled: priority_j / 5.0)
avoidable_idle_weight: 0.30       # Demand-gated penalty for idle GPUs ONLY when waiting runnable jobs could have fit
invalid_action_penalty: 1.00      # Action rejection penalty
step_penalty: 0.001               # Minor tie-breaker to encourage rapid job dispatching
